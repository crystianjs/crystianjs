
name: Generate Contribution Garden

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: crystianjs
          outputs: |
            dist/github-contribution-grid-snake-orange.svg?color_snake=FF3B00&color_dots=#161B22,#3D1A12,#7A2A13,#C43B0A,#FF3B00

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
